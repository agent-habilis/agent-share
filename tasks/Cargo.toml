[package]
name = "tasks"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Mirrors the root crate's clap (Cargo.toml) — already in Cargo.lock, so
# no new toolchain install. xshell is a library cargo compiles
# automatically, not a binary anyone installs.
clap = { version = "4", features = ["derive"] }
xshell = "0.2"
# Cross-compile driver, used as a *library* (not a global `cargo install`): the
# `build` task calls `Build::execute()` directly, and `main`'s hidden `zig`
# subcommand delegates to its `Zig` shim — see tasks/src/build.rs.
cargo-zigbuild = "0.23"
# `cargo task man` generates roff pages in-process: it walks the agent-share
# crate's clap tree (`cli_command`) through `clap_mangen`. This makes the
# agent-share lib a build dependency of the task runner.
agent-share = { path = "../crates/agent-share" }
# The real ticket codec, so the e2e matrix can build a *legacy* ticket (one with
# no mesh id) by decoding and re-encoding rather than by hand-rolling the format
# here — a second copy would drift, and the drift would read as a passing test.
# Already in Cargo.lock: `agent-share` depends on it.
agent-share-proto = { path = "../crates/agent-share-proto" }
clap_mangen = "0.2"
# Cargo-style status output, shared with the binary by `include!`ing its
# canonical source (`../src/util/output.rs`) — see `src/util/output.rs`.
# anstyle styles; anstream strips color when the stream isn't a terminal.
anstyle = "1"
anstream = "0.6"
# `bench` parses `agent-share bench --output json` and writes `docs/perf/`.
# Both versions mirror the root workspace's, so nothing new enters Cargo.lock.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
