[package]
name = "s01-baotree-wasm"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway spike: does `bao-tree` build for wasm32-unknown-unknown with the
# feature set RFC 03 proposes, and does blake3's `wasm32_simd` come along?
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# RFC 01 claims "bao-tree minus its fs feature is wasm-clean". The verified
# default set is ["tokio_fsm", "validate", "serde", "fs"], and tokio_fsm pulls
# iroh-io (std/fs-bound) — so the wasm-clean recipe is default-features = false
# plus selectively re-adding what we need.
bao-tree = { version = "0.16", default-features = false, features = ["validate"] }
blake3 = { version = "1.8.5", default-features = false, features = ["std"] }
bytes = "1"

[features]
# Toggled by the spike runner to compare portable vs SIMD wasm.
wasm-simd = ["blake3/wasm32_simd"]
rayon = ["blake3/rayon"]

[workspace]
