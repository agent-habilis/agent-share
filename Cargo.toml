[workspace]
members = ["crates/*", "tasks"]
# Load-bearing on a *virtual* manifest: a root package on edition 2024 implies
# `resolver = "3"`, but a virtual workspace inherits nothing from its members
# and silently defaults to the edition-2015 `resolver = "1"`. Left implicit,
# the split from root-package to virtual would quietly change feature
# unification across the whole graph — surfacing as a mysterious build failure
# with nothing pointing back at the move.
resolver = "3"
# With no root package, an unscoped `cargo build`/`test`/`clippy`/`run` defaults
# to *every* member. The vendored mesh that made that expensive is gone, so this
# now only pins the historical meaning; dropping it is a small, separate change.
default-members = ["crates/agent-share"]
# A member by glob, but it must not be one in fact: this is a wasm32-only
# cdylib (`web_sys::window()` does not exist off wasm32), so a `--workspace`
# build — which `cargo task ci` runs — would fail on it. It keeps its own
# `[workspace]`, and therefore its own duplicated `[patch.crates-io]`, because
# patches are not inherited across a workspace boundary.
exclude = ["crates/agent-share-wasm-client"]

# Shared package fields. Each crate opts in with `edition.workspace = true`
# / `rust-version.workspace = true` so the workspace stays in lockstep
# on toolchain expectations.
[workspace.package]
edition = "2024"
rust-version = "1.93"

# Shared by the crates here, pinned once so versions stay in lockstep. This
# block was originally sized for the vendored mesh, which took most of its
# dependencies as `workspace = true`; the mesh now lives in
# `fofoca-network/fofoca` and brings its own, so entries here that nothing
# names any more can be pruned.
[workspace.dependencies]
# The gossip engine and its sibling crates, pinned by **rev** so this workspace
# and agent-gossip provably build against the same fofoca. Declared here, not in
# the member manifests, so the rev is stated once -- four crates x two members
# restating it is the drift this pin exists to prevent.
#
# The cost is deliberate: an engine change is now release-then-bump here, where
# a path dep to a sibling checkout needed no round trip. fofoca cuts tags
# (vX.Y.Z); name the tag, never a raw rev, and keep it in step with
# agent-gossip's.
fofoca = { git = "https://github.com/fofoca-network/fofoca", tag = "v0.6.0" }
fofoca-protocol = { git = "https://github.com/fofoca-network/fofoca", tag = "v0.6.0", default-features = false }
fofoca-blobs = { git = "https://github.com/fofoca-network/fofoca", tag = "v0.6.0" }
fofoca-iroh-webrtc-transport = { git = "https://github.com/fofoca-network/fofoca", tag = "v0.6.0" }
# The content-addressed chunk store, a member of the same monorepo since
# v0.6.0 (it grew up in this repo under crates/fofoca-chunks and moved).
fofoca-chunks = { git = "https://github.com/fofoca-network/fofoca", tag = "v0.6.0" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
anyhow = "1"
bytes = "1"
anstyle = "1"
anstream = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
async-trait = "0.1.89"
uuid = { version = "1", features = ["v4"] }
# NOTE: no `iroh` entry, and no `[patch.crates-io]` anywhere in this repo. The
# iroh family is reached through `fofoca::iroh` / `fofoca_protocol::iroh_base`,
# and `fofoca` owns which fork and revision that is. Declaring iroh here would
# resolve the published crate alongside the engine's fork -- two `iroh` crates
# in one graph, surfacing later as an E0308 on types that look identical. This
# entry used to say 1.0.1 while every other manifest said 1.0.2; deleting the
# declaration is the only fix for that class of drift that cannot regress.
bs58 = "0.5"
automerge = "0.10"
sha2 = "0.10"
rand = "0.9"
libc = "0.2"
proptest = "1.6"
insta = "1"
divan = "0.1"

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"
# Reject non-ASCII identifiers (homoglyph / supply-chain hardening;
# matches the project's ASCII-only protocol ethos).
non_ascii_idents = "deny"
# Require an explicit `unsafe {}` block inside any `unsafe fn`.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Prevents holding a sync `std::sync::Mutex` (or RwLock) guard across an
# `.await` point — a recipe for deadlocks.
await_holding_lock = "deny"
# Cargo.toml hygiene (metadata, wildcard deps, feature names, ...).
cargo = { level = "warn", priority = -1 }
# cherry-picked restriction lints that aid readability
min_ident_chars = "warn"
shadow_unrelated = "warn"
semicolon_inside_block = "warn"
allow_attributes_without_reason = "warn"
# Force `#[expect(...)]` over `#[allow(...)]` where the lint still fires, so a
# suppression that goes stale (lint no longer triggers) becomes a build error
# instead of silently lingering.
allow_attributes = "warn"
# Forbid `_ =>` catch-all arms on enum matches: a new variant must be
# handled explicitly rather than silently swallowed by a wildcard.
wildcard_enum_match_arm = "warn"
# documented opt-out (noise / not a readability win): keep CI signal useful
module_name_repetitions = "allow"
# Transitive duplicate crate versions are not controllable from a leaf
# binary; the lint is noise here, not an actionable signal.
multiple_crate_versions = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3

# Release-quality runtime perf with much faster build times — for CI and
# anywhere local "full test" runs need crypto/network speed without
# paying the fat-LTO + 1-codegen-unit price of `[profile.release]`.
[profile.ci]
inherits = "release"
lto = "thin"
codegen-units = 16

# NOTE: no local-testing [patch] here, ever. To test in-progress fofoca work
# from the sibling checkout, patch in this repo's .cargo/config.toml instead:
# a config-level [patch] applies to every workspace under this directory —
# including the nested wasm-client workspace, which a manifest patch here
# cannot reach — and the pre-commit hook guards that file against committing
# the local section.
