<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>agent-share</title>
    <!--
      First-paint guard: pick the light/dark half of the page chrome before any
      JavaScript runs, so a hard reload never flashes the wrong colors. The app
      paints its chrome with --bg-sunken (see app.css), hence that pair here.
      color-scheme goes on html only — never body, which would pin it.
    -->
    <style>
      html {
        color-scheme: light dark;
        background: light-dark(#f6f6f6, #1e1d1e);
        color: light-dark(#272727, #ffffff);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../main.tsx"></script>
  </body>
</html>
