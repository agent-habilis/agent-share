<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>agent-share</title>
    <!--
      First-paint guard: pick the light/dark half of the page chrome before any
      JavaScript runs, so a hard reload never flashes the wrong colors. The page
      ground is --bg; the top bar and the iOS status strip get --bg-sunken from
      body's background-color (see app.css).
      color-scheme goes on html only — never body, which would pin it.
    -->
    <style>
      html {
        color-scheme: light dark;
        background: light-dark(#ffffff, #272727);
        color: light-dark(#272727, #ffffff);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../main.tsx"></script>
  </body>
</html>
