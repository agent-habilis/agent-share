[package]
name = "agent-habilis-mesh"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "serverless gossip-network engine for agent-gossip"
license = "MIT"
publish = false

[lints]
workspace = true

[lib]
name = "agent_habilis_mesh"
path = "src/lib.rs"

[features]
default = ["host"]
# On by default. The parts of the engine that need an operating system: the
# daemon event loop and its state file, the unix-socket / named-pipe IPC
# listener, the process helpers, the log sink, and blob production (which reads
# files from disk).
#
# Turning it off leaves the portable engine — gossip, the CRDT documents, the
# protocol and identity types, address lookup, blob *consumption* — which is
# what a browser needs and all it can have: `interprocess`, `libc`, signals,
# processes and the filesystem have no wasm32 equivalent.
#
# CI builds `--no-default-features` for wasm32; without that gate the browser
# target rots on the next edit that reaches for a file.
host = [
    "dep:iroh-multihop-transport",
    # mDNS and the mainline DHT both need real UDP sockets.
    "dep:iroh-mdns-address-lookup",
    "dep:iroh-mainline-address-lookup",
    "dep:interprocess",
    "dep:libc",
    "dep:tracing-subscriber",
    "tokio/rt-multi-thread",
    "tokio/fs",
    "tokio/signal",
    "tokio/net",
    "tokio/process",
    "tokio/io-util",
]
# Off by default. Exposes the engine's cross-crate test fixtures (`Message`
# builders, `From<&str>` conveniences, etc.) — items otherwise `#[cfg(test)]`
# — so the app's test suites (which live in a separate crate now) can build
# them. The app enables it through its `[dev-dependencies]`, so it is on for
# `cargo test` and off for a normal/release build.
test-fixtures = []
# Off by default. Exposes the engine internals (crafted-message + state-doc
# constructors) the app's `harness::adversarial` shim reaches so the adversarial
# suite can inject malicious wire messages. Never enabled in a normal build.
adversarial = ["test-fixtures"]
# Off by default. Gates out the daemon's `std::process::exit` on the quit path
# so the daemon returns cleanly and the app's dhat heap profiler (installed in
# `main`) can flush `dhat-heap.json`. The app's `dhat-heap` feature forwards to
# this one. Never in a normal build.
dhat-heap = []

[dependencies]
# Base features only — `rt-multi-thread`, `fs`, `signal`, `net` and `process`
# have no wasm32 equivalent and are added back by `host`.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "time", "rt"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
bytes.workspace = true
tracing.workspace = true
async-trait.workspace = true
uuid.workspace = true
# The multi-hop iroh custom transport: reach a peer with no direct path by
# relaying its QUIC packets through intermediate peers. Registered on the
# peer endpoint (the `--multihop` flag).
iroh-multihop-transport = { path = "../iroh-multihop-transport", optional = true }
bs58.workspace = true
automerge.workspace = true
sha2.workspace = true
rand.workspace = true
libc = { workspace = true, optional = true }
anstyle.workspace = true
anstream.workspace = true
# mDNS + mainline-DHT address-lookup providers were extracted from iroh core
# in the 1.0 line; these companion crates restore the `--mdns` / `--dht` legs.
iroh-mdns-address-lookup = { version = "0.4", optional = true }
iroh-mainline-address-lookup = { version = "0.4", optional = true }
# Argon2id password stretching for `--password` (mesh hash verifier + ticket
# handshake tokens). default-features off: no `password-hash` string format —
# we only need the raw `hash_password_into` KDF.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
futures-util = "0.3"
# The crate's clock, re-exported from `util::clock`. Unconditional because the
# crate is `pub use std::time::*` off wasm32 and pulls in nothing there; only a
# browser gets the `Performance.now()`/`Date.now()` implementation. Without it
# every `Instant::now()`/`SystemTime::now()` in the portable core panics on
# `wasm32-unknown-unknown` — a runtime failure `cargo check` cannot see.
web-time = "1.1"
# Timers and task spawning, the other half of the portability story: `web-time`
# fixes `Instant`, but `tokio::time` still panics on wasm32 because there is no
# timer driver, and `tokio::spawn` needs a runtime nothing can `block_on` on a
# browser main thread. Off wasm32 this is a verbatim re-export of
# `tokio::{time, spawn}`, so host behaviour is unchanged — note in particular
# that `n0_future::time::Instant` *is* `tokio::time::Instant` there, and stays
# distinct from `util::clock::Instant`. Taken as a direct dependency rather than
# leaned on transitively through iroh, so the API surface is ours to pin.
n0-future = "0.3"
# End-to-end sealing of directed frames: a NaCl-style sealed box (ephemeral
# X25519 ECDH → ChaCha20-Poly1305) so only the addressed recipient can read a
# directed body. The AEAD key is derived from the ECDH secret via the in-tree
# `crypto::derive_secret` (SHA-256), so no HKDF dep. Both crates are pure-Rust
# (no `unsafe`, which the workspace denies).
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
# Best-effort wiping of retained secrets (the mesh password + derived channel
# keys) on drop, so they don't linger in process memory / core dumps.
zeroize = "1"
interprocess = { version = "2", features = ["tokio"], optional = true }
tracing-subscriber = { workspace = true, optional = true }

# The WebRTC lane is not optional: it is the browser's only way onto the mesh.
# Only the backend differs by target — str0m natively, the platform's own
# RTCPeerConnection in a tab — and `WebRtcHandle` is the same type either way,
# so the wiring in `lookup` is written once.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fofoca-iroh-webrtc-transport = { path = "../fofoca-iroh-webrtc-transport", features = ["host"] }
iroh.workspace = true
iroh-gossip.workspace = true

# iroh's default features (portmapper, fast-apple-datapath, metrics) are
# host-only and drag `tokio/net` -> `mio`, which refuses to build for wasm32.
# The browser needs the endpoint and the relay transport and nothing else.
[target.'cfg(target_arch = "wasm32")'.dependencies]
fofoca-iroh-webrtc-transport = { path = "../fofoca-iroh-webrtc-transport", features = ["web"] }
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
# Both generations that reach wasm need their browser backend switched on. 0.3+
# additionally needs the `getrandom_backend` rustflag — see .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
# `uuid` v4 needs its own randomness source named on wasm32.
uuid = { version = "1", features = ["v4", "js"] }

# Scoped to non-wasm on purpose. The workspace `tokio` turns on `net`, which
# drags in `mio` — and `mio` refuses to build for wasm32. Dev-dependencies are
# resolved for test targets too, so leaving these unscoped makes
# `cargo test --target wasm32-unknown-unknown` fail before it reaches any test
# of ours. Everything here backs host unit tests, which never run on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true
insta.workspace = true
tokio.workspace = true
divan.workspace = true

# The wasm test harness. Only a browser/node target runs it, and only
# `tests/wasm_runtime.rs` uses it — see that file for why it has to exist.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Stamps the build's git short hash + dirty flag into the version
# (`util::version::VERSION`), so every build self-identifies its commit in
# `--version`, the `ready` event, and every log line. git-CLI backend — no
# libgit2/gix; build hosts all have `git`.
[build-dependencies]
vergen-gitcl = "1"
