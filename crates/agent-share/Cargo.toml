[package]
name = "agent-share"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Caio Gondim <me@caiogondim.com>"]
description = "share a directory read-only over iroh QUIC, mounted locally via NFS"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-share"
readme = "README.md"
keywords = ["agents", "mount", "nfs", "p2p"]
categories = ["network-programming", "filesystem"]
exclude = [".cargo/", "tasks/"]

[lints]
workspace = true

[package.metadata.release]
publish = false
push = false
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
allow-branch = ["main"]

# Note: there is NO `rust_2021_idioms` group. `rust_2018_idioms` is the only
# idioms group and is still correct on edition 2021 (it bundles
# bare_trait_objects, elided_lifetimes_in_paths, explicit_outlives_requirements,
# unused_extern_crates, ellipsis_inclusive_range_patterns).
[lib]
name = "agent_share"
path = "src/lib.rs"

[[bin]]
name = "agent-share"
path = "src/main.rs"

[dependencies]
# The wire format, shared verbatim with the browser client. Anything both
# ends must agree on lives there, not here.
agent-share-proto = { path = "../agent-share-proto" }
agent-share-mount = { path = "../agent-share-mount" }
# The content-addressed chunk store. The dependency runs one way only:
# `agent-share` knows about `fofoca-chunks`, and `fofoca-chunks` knows nothing
# about shares — enforced on its side by `tests/isolation.rs`.
#
# Developed here and named for `fofoca-network/fofoca`, where it is meant to
# land once it settles; the move is then a `git mv` plus a path edit. It
# replaces `fofoca-blobs`, whose bao outboards prove *placement* rather than
# content and therefore can never dedup or be served by a peer that does not
# know the file.
fofoca-chunks = { path = "../fofoca-chunks" }
# The gossip engine. A share joins a mesh derived from its own ticket secret, so
# everyone holding the link becomes a peer of everyone else rather than only of
# the producer. Note this pulls the vendored mesh into `default-members`, which
# the root manifest previously avoided — it is a real build-time cost.
fofoca = { workspace = true }
# The WebRTC lane. `native` here — the browser client takes the same crate with
# `web` instead.
fofoca-iroh-webrtc-transport = { workspace = true, features = ["native"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "signal", "net", "process"] }
clap = { version = "4", features = ["derive"] }
anstyle = "1"
anstream = "0.6"
# NOTE: no `iroh` and no address-lookup entries. All three are reached through
# `fofoca` -- `fofoca::iroh`, `fofoca::iroh_mdns_address_lookup`,
# `fofoca::iroh_mainline_address_lookup` -- because the engine needs a forked
# iroh and a second declaration here would resolve the published crate beside
# it. The `unstable-custom-transports` feature the WebRTC lane needs is enabled
# by fofoca's own iroh entry, so it arrives with the re-export.
anyhow = "1"
sha2 = "0.10"
bs58 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nfsserve = "0.11.0"
async-trait = "0.1.89"
# Filesystem change notification behind `serve`'s live tree. Default features
# on purpose: they select the platform's native backend (FSEvents, inotify,
# ReadDirectoryChangesW) instead of the portable poll-every-N-seconds
# fallback, which on a 70k-file share would cost a full stat sweep per tick.
notify = "8"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }

[dev-dependencies]
# One temp directory helper instead of the hand-rolled copy each test file
# used to carry. They all did the same thing — unique name, `create_dir_all`,
# remove-on-drop — and each was a chance to get cleanup subtly wrong.
tempfile = "3"
# `test-utils` brings `iroh::test_utils::run_relay_server`, which the path
# selection regression test needs: reproducing "the warm relay wins the mount
# dial and is pinned forever" requires a real relay path in the address book,
# and every other test here runs with `RelayMode::Disabled` precisely to stay
# off the network.
#
# Enabled through fofoca rather than by naming iroh: this crate declares no iroh
# of its own, so `fofoca/iroh-test-utils` is how an optional iroh feature is
# turned on without putting a second iroh in the graph. A dev-dependency, so
# resolver 3 keeps the feature out of a plain build.
fofoca = { workspace = true, features = ["iroh-test-utils"] }
