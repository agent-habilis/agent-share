# Standalone workspace on purpose: `[patch.crates-io]` is not inherited across
# workspace boundaries, so the iroh fork pins are duplicated below and must be
# bumped in lockstep with the root manifest. Keeping this out of the root
# workspace also keeps `web-sys` out of the host lockfile and out of
# `cargo task ci`'s default build.
#
# Path deps DO cross the boundary, so this still links the very same
# `agent-share-proto` and `fofoca-iroh-webrtc-transport` the CLI does.
[package]
name = "agent-share-wasm-client"
version = "0.1.0"
edition = "2024"
description = "Browser client for agent-share: the mount protocol over a WebRTC data channel"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-share"
publish = false

[workspace]

[lib]
# `rlib` so unit tests (transport mode parsing) can run on the host; `cdylib`
# is what wasm-bindgen / the browser load.
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-share-proto = { path = "../agent-share-proto" }
agent-share-mount = { path = "../agent-share-mount" }
# The gossip engine, portable half only: `host` pulls in signals, the control
# socket, the filesystem and multihop, none of which exist in a tab. What
# remains is the whole node runtime — `setup_mesh` → `Node::spawn` → the event
# loop — so a browser peer is the same peer a CLI runs, not a reduced stand-in.
fofoca = { git = "https://github.com/fofoca-network/fofoca", rev = "a80fde2e86fcb96bb8bf7e0e8ccb81d2ec28f75b", default-features = false }
fofoca-iroh-webrtc-transport = { git = "https://github.com/fofoca-network/fofoca", rev = "a80fde2e86fcb96bb8bf7e0e8ccb81d2ec28f75b", features = ["web"] }
# NOTE: no iroh entries -- taken from `fofoca::iroh` and
# `fofoca_protocol::iroh_base`, which this crate already depends on.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
futures = "0.3"
# Lets a `!Send` value satisfy a `Send + Sync` bound, panicking if it is ever
# touched from another thread. Sound here because wasm is single-threaded, and
# necessary because iroh's `DynProtocolHandler` requires `Send + Sync` while the
# producer's state holds `FileSystemFileHandle`s, which are JS values.
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
    "Window",
    "File",
    "Blob",
    "console",
    "FileSystemHandle",
    "FileSystemFileHandle",
    # The manifest locator: a refreshed tab re-arms its seeder from storage,
    # and localStorage is where the tiny (size, tree) record lives.
    "Storage",
    # The channel-health watcher reads `connectionState` off the transport's
    # RtcPeerConnection (`BrowserHubTransport::peer_connection`) to notice a
    # dead data channel in seconds instead of waiting out the QUIC idle
    # timeout.
    "RtcPeerConnection",
    "RtcPeerConnectionState",
] }
# Both generations that reach wasm need their browser backend switched on.
# 0.3+ additionally needs the `getrandom_backend` rustflag — see
# `.cargo/config.toml`, and note the feature alone is NOT enough.
# The chunk layer. Kept as a separate crate so nothing about addressing or
# storage leaks into the share protocol — see `fofoca-chunks`'s isolation
# tests. Developed in this workspace and named for `fofoca-network/fofoca`,
# where it is meant to land; the path dep becomes a rev-pinned git dependency
# after the move.
fofoca-chunks = { path = "../fofoca-chunks" }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

# The unit tests run on wasm32, because that is the only target this crate
# builds for at all: `fofoca` turns on
# `fofoca-iroh-webrtc-transport/native` off wasm32, and with both backends
# enabled `WebRtcHandle` resolves to the host one — so a host build of this
# crate cannot type-check by construction. Each `mod tests` renames the
# attribute (see `transport_mode.rs`), so the tests stay plain `#[test]`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# NOTE: no `[patch.crates-io]`. This nested workspace inherits no patches --
# which used to mean duplicating the root's pins here. It now needs none:
# every iroh-family fork rides a dependency edge inside `fofoca`.

# NOTE: no local-testing [patch] here either — see the root Cargo.toml. The
# sibling-checkout redirect lives in the repo's .cargo/config.toml, which
# reaches this nested workspace where a manifest patch cannot.

[profile.release]
opt-level = "s"
lto = true
