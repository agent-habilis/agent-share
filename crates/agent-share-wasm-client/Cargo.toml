# Standalone workspace on purpose: `[patch.crates-io]` is not inherited across
# workspace boundaries, so the iroh fork pins are duplicated below and must be
# bumped in lockstep with the root manifest. Keeping this out of the root
# workspace also keeps `web-sys` out of the host lockfile and out of
# `cargo task ci`'s default build.
#
# Path deps DO cross the boundary, so this still links the very same
# `agent-share-proto` and `fofoca-iroh-webrtc-transport` the CLI does.
[package]
name = "agent-share-wasm-client"
version = "0.1.0"
edition = "2024"
description = "Browser client for agent-share: the mount protocol over a WebRTC data channel"
license = "MIT"
repository = "https://github.com/agent-habilis/agent-share"
publish = false

[workspace]

[lib]
# `rlib` so unit tests (transport mode parsing) can run on the host; `cdylib`
# is what wasm-bindgen / the browser load.
crate-type = ["cdylib", "rlib"]

[dependencies]
agent-share-proto = { path = "../agent-share-proto" }
# The gossip engine, portable half only: `host` pulls in signals, the control
# socket, the filesystem and multihop, none of which exist in a tab. What
# remains is the whole node runtime — `setup_mesh` → `Node::spawn` → the event
# loop — so a browser peer is the same peer a CLI runs, not a reduced stand-in.
agent-habilis-mesh = { path = "../agent-habilis-mesh", default-features = false }
fofoca-iroh-webrtc-transport = { path = "../fofoca-iroh-webrtc-transport", features = ["web"] }
iroh = { version = "1.0.1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = { version = "1.0.1", default-features = false, features = ["key"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
futures = "0.3"
# Lets a `!Send` value satisfy a `Send + Sync` bound, panicking if it is ever
# touched from another thread. Sound here because wasm is single-threaded, and
# necessary because iroh's `DynProtocolHandler` requires `Send + Sync` while the
# producer's state holds `FileSystemFileHandle`s, which are JS values.
send_wrapper = "0.6"
web-sys = { version = "0.3", features = [
    "Window",
    "File",
    "Blob",
    "console",
    "FileSystemHandle",
    "FileSystemFileHandle",
] }
# Both generations that reach wasm need their browser backend switched on.
# 0.3+ additionally needs the `getrandom_backend` rustflag — see
# `.cargo/config.toml`, and note the feature alone is NOT enough.
# The blob layer. Kept as a separate crate so nothing about verification,
# outboards or storage leaks into the share protocol — see `fofoca-blobs`'s
# isolation tests.
fofoca-blobs = { path = "../fofoca-blobs" }
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }

# The unit tests run on wasm32, because that is the only target this crate
# builds for at all: `agent-habilis-mesh` turns on
# `fofoca-iroh-webrtc-transport/host` off wasm32, and with both backends
# enabled `WebRtcHandle` resolves to the host one — so a host build of this
# crate cannot type-check by construction. Each `mod tests` renames the
# attribute (see `transport_mode.rs`), so the tests stay plain `#[test]`.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

# Same fork/rev pins as the root workspace. Patches are not inherited across
# workspace boundaries, so they are duplicated here and must move together.
[patch.crates-io]
iroh = { git = "https://github.com/agent-habilis/iroh", rev = "195cb98d16969da48743e88a0dbb395d118316ed" }
iroh-base = { git = "https://github.com/agent-habilis/iroh", rev = "195cb98d16969da48743e88a0dbb395d118316ed" }
iroh-dns = { git = "https://github.com/agent-habilis/iroh", rev = "195cb98d16969da48743e88a0dbb395d118316ed" }

[profile.release]
opt-level = "s"
lto = true
