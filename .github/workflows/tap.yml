name: tap

# Mirror the formula only once it is on `main`. The release workflow lands the
# bump through a PR, and a PR that fails CI or closes unmerged must not reach
# the tap.
on:
  push:
    branches: [main]
    paths: [Formula/agent-share.rb]

permissions:
  contents: read

concurrency:
  group: tap
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The GITHUB_TOKEN is scoped to this repo, so mirroring into the org
      # tap needs the TAP_PUSH_TOKEN secret (fine-grained PAT, contents
      # read/write on homebrew-tap only).
      - uses: actions/checkout@v5
        with:
          repository: agent-habilis/homebrew-tap
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap
      - name: Mirror the formula to the org tap
        run: |
          ver=$(sed -nE 's/^  version "([^"]*)"/\1/p' Formula/agent-share.rb)
          cp Formula/agent-share.rb tap/Formula/agent-share.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-share.rb
          git diff --cached --quiet || git commit -m "agent-share v${ver}"
          git push
